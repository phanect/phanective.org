version: 2.1

orbs:
  node: circleci/node@5

jobs:
  security-audit:
    docker:
      - image: cimg/node:20.11
    steps:
      - checkout
      - node/install-pnpm:
          pnpm-version: 11.27.0
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Run security audit and fix
          command: pnpm audit --fix=update || true
      - run:
          name: Check for changes and create PR if needed
          command: |
            # Check if there are changes
            if [ -z "$(git status --porcelain)" ]; then
              echo "No changes detected, skipping PR creation"
              exit 0
            fi

            # Configure git
            git config --global user.name "phanect-bot"
            git config --global user.email "bot@phanect.com"

            # Commit changes
            git add -A
            git commit -m "chore: update dependencies from security audit"

            # Create branch name with timestamp
            BRANCH_NAME="security-audit-$(date +%Y%m%d%H%M%S)"

            # Push to new branch
            git push origin HEAD:$BRANCH_NAME

            # Create PR using GitHub API
            PR_TITLE="chore: update dependencies from security audit"
            PR_BODY="Automated dependency updates from pnpm audit --fix=update"
            REPO="phanect/phanective.org"

            curl -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/$REPO/pulls \
              -d "{
                \"title\": \"$PR_TITLE\",
                \"body\": \"$PR_BODY\",
                \"head\": \"$BRANCH_NAME\",
                \"base\": \"main\",
                \"assignee\": \"phanect\"
              }"

workflows:
  daily-security-audit:
    triggers:
      - schedule:
          cron: "0 0 * * *"  # Daily at midnight UTC
          filters:
            branches:
              only: main
    jobs:
      - security-audit
